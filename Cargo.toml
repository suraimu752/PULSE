[package]
name = "pulse"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-only"
description = "PULSE — a lightweight Windows 11 task manager"
repository = "https://github.com/suraimu752/PULSE"
readme = "README.md"
publish = false
keywords = ["windows", "task-manager", "slint"]
categories = ["os::windows-apis"]

[features]
default = ["ui"]
# The window is optional so the Windows collectors can be type-checked on a
# non-Windows host (`cargo check --target x86_64-pc-windows-gnu --no-default-features`)
# without cross-compiling the GUI toolkit.
ui = ["dep:slint"]
# Development-only demo collector. Release builds omit this feature, so
# `PULSE.exe` from CI cannot enter demo mode.
mock = ["ui"]

[dependencies]
slint = { version = "1.19.0", optional = true, default-features = false, features = [
    "std",
    "backend-default",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-18",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Time",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
] }

[dev-dependencies]
i-slint-backend-testing = "1.19.0"

[build-dependencies]
slint-build = "1.19.0"

[lib]
name = "pulse"
path = "src/lib.rs"

[[bin]]
name = "PULSE"
path = "src/main.rs"
# There are no tests in main.rs. Elevation is applied by the linker wrapper
# only when the output name is PULSE.exe, because a link-arg would also mark
# the PULSE-<hash> harness and break `cargo test` on Windows.
test = false
bench = false

[profile.release]
strip = "symbols"
