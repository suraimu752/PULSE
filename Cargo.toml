[package]
name = "pulse"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-only"
description = "PULSE — a lightweight Windows 11 task manager"
repository = "https://github.com/suraimu752/PULSE"
readme = "README.md"
publish = false
keywords = ["windows", "task-manager", "slint"]
categories = ["os::windows-apis"]

[features]
default = ["ui"]
# The window is optional so the Windows collectors can be type-checked on a
# non-Windows host (`cargo check --target x86_64-pc-windows-gnu --no-default-features`)
# without cross-compiling the GUI toolkit.
ui = ["dep:slint"]

[dependencies]
slint = { version = "1.19.0", optional = true, default-features = false, features = [
    "std",
    "backend-default",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-18",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.19.0"

[lib]
name = "pulse"
path = "src/lib.rs"

[[bin]]
name = "PULSE"
path = "src/main.rs"

[profile.release]
strip = "symbols"
