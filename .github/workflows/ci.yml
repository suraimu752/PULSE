name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: fmt / clippy / test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Slint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libegl1-mesa-dev libgles2-mesa-dev \
            libfontconfig1-dev
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        # `--lib --tests` skips the empty PULSE.exe unit-test harness. On Windows
        # that harness would otherwise inherit the admin manifest (see build.rs).
        run: cargo test --lib --tests --all-features

  windows:
    name: fmt / clippy / test / build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        # Do not run the PULSE-<hash> harness. MSVC attaches requireAdministrator
        # to it as well as to PULSE.exe, and an elevated harness fails CI.
        run: cargo test --lib --tests --all-features
      - name: cargo build (release)
        run: cargo build --release --locked
      - name: Show PULSE.exe
        shell: pwsh
        run: Get-Item target/release/PULSE.exe | Format-List FullName, Length
      - name: Assert embedded administrator manifest
        shell: pwsh
        run: |
          $path = "target/release/PULSE.exe"
          if (-not (Test-Path $path)) { throw "missing $path" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          $utf16 = [System.Text.Encoding]::Unicode.GetString($bytes)
          foreach ($text in @("requestedExecutionLevel", "requireAdministrator")) {
            if (($ascii.IndexOf($text) -lt 0) -and ($utf16.IndexOf($text) -lt 0)) {
              throw "PULSE.exe is missing manifest text: $text"
            }
          }
          if ($ascii.Contains('level="asInvoker"') -or $utf16.Contains('level="asInvoker"')) {
            throw "PULSE.exe still requests asInvoker"
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if (($ascii.IndexOf($version) -lt 0) -and ($utf16.IndexOf($version) -lt 0)) {
            throw "PULSE.exe is missing FileVersion $version"
          }
          if (($ascii.IndexOf("ProductName") -lt 0) -and ($utf16.IndexOf("ProductName") -lt 0)) {
            throw "PULSE.exe is missing VERSIONINFO ProductName"
          }
          Write-Host "embedded requireAdministrator manifest: ok ($($bytes.Length) bytes, $version)"
      - name: Zip PULSE.exe with its SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/PULSE.exe dist/PULSE.exe
          $hash = (Get-FileHash dist/PULSE.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii -Value "$hash  PULSE.exe"
          Compress-Archive -Path dist/PULSE.exe, dist/SHA256SUMS.txt -DestinationPath PULSE-windows-x64.zip -Force
          Write-Host "SHA256 $hash"
      - name: Upload PULSE.exe
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-windows-x64
          path: target/release/PULSE.exe
          if-no-files-found: error
      - name: Upload unsigned zip
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-windows-x64-zip
          path: |
            PULSE-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
